name: 每日中文简报
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-briefs
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 确定北京时间日期
        id: day
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: briefs-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: briefs-${{ steps.day.outputs.date }}-
      - name: 生成两份简报并推送微信
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: python briefs.py
      - name: 保存当日发送记录
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: briefs-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 保留简报七天
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-briefs-${{ github.run_id }}
          path: reports/*.md
          retention-days: 7
          if-no-files-found: ignore
